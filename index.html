<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GMIU Cloud Computing - Student Notes Manager</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; background: #f8fafc; color: #1e293b; }
    .card { background: white; padding: 24px; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #0284c7; }
    .badge { display: inline-block; background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-bottom: 16px; }
    input, textarea, button { width: 100%; box-sizing: border-box; margin-bottom: 12px; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px; }
    button { background: #0284c7; color: white; border: none; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    .note-item { background: #f1f5f9; padding: 12px; border-radius: 6px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }
    .delete-btn { width: auto; margin: 0; background: #ef4444; padding: 6px 12px; font-size: 12px; }
    .delete-btn:hover { background: #dc2626; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Cloud Platform: Firebase / Google Cloud (PaaS)</div>
    <h2>Student Notes Saver</h2>
    <form id="noteForm">
      <input type="text" id="title" placeholder="Note Title / Subject" required />
      <textarea id="content" rows="3" placeholder="Enter details..." required></textarea>
      <button type="submit" id="submitBtn">Save to Cloud Firestore</button>
    </form>

    <h3 style="margin-top: 24px;">Stored Cloud Records</h3>
    <div id="notesList"><p style="color: #64748b;">Loading records from Firestore...</p></div>
  </div>

  <!-- Firebase App & Firestore SDKs -->
  <script type="module" src="app.js"></script>
</body>
</html>
